# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'

    Symfony\Component\HttpClient\Psr18Client: ~

    App\Domain\Event\EventRepository: '@App\Infrastructure\Doctrine\DoctrineEventRepository'
    App\Domain\Event\EventTaskListRepository: '@App\Infrastructure\Doctrine\DoctrineEventTaskListRepository'
    App\Domain\Event\EventHelferLinkRepository: '@App\Infrastructure\Doctrine\DoctrineEventHelferLinkRepository'
    App\Domain\Event\EventDayRepository: '@App\Infrastructure\Doctrine\DoctrineEventDayRepository'
    App\Domain\Event\EventResponseRepository: '@App\Infrastructure\Doctrine\DoctrineEventResponseRepository'
    App\Domain\Poll\PollRepository: '@App\Infrastructure\Doctrine\DoctrinePollRepository'
    App\Domain\Ride\RideRepository: '@App\Infrastructure\Doctrine\DoctrineRideRepository'
    App\Domain\Fleet\VehicleRepository: '@App\Infrastructure\Doctrine\DoctrineVehicleRepository'
    App\Domain\Gastronomy\GastroPlanRepository: '@App\Infrastructure\Doctrine\DoctrineGastroPlanRepository'
    App\Domain\Event\PlaceRepository: '@App\Infrastructure\Doctrine\DoctrinePlaceRepository'
    App\Domain\Audit\AuditEntryRepository: '@App\Infrastructure\Doctrine\DoctrineAuditEntryRepository'
    App\Domain\Spond\SpondReadRepository: '@App\Infrastructure\Doctrine\DoctrineSpondReadRepository'
    App\Domain\Account\MemberLinkRepository: '@App\Infrastructure\Doctrine\DoctrineMemberLinkRepository'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
