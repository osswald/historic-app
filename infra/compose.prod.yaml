# Public host: https://app.historic-winterthur.ch
# Infomaniak Public Cloud (OpenStack): Ubuntu LTS, floating IP, security group
# for 22/80/443. Postgres stays on the compose network and is not published.
# AUTH_DEV_MODE is off. The public host does not accept the demo Bearer token.
# Caddy keeps certificates in historic_caddy_data. Without that volume every
# deploy starts from empty storage and requests a new certificate.

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - historic_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      AUTH_DEV_MODE: "0"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_GROUPS_CLAIM: ${AUTH0_GROUPS_CLAIM:-https://historic-winterthur.ch/groups}
      DEV_USER_NAME: Demo Mitglied
      DEV_USER_GROUPS: admin,Mitglieder,Fahrtenplanung,Gastro-Team,Technische Kommission
      CORS_ALLOW_ORIGIN: "^https://app[.]historic-winterthur[.]ch$$"
      DEFAULT_URI: https://app.historic-winterthur.ch
      SERVER_NAME: app.historic-winterthur.ch
      SPOND_USERNAME: ${SPOND_USERNAME:-}
      SPOND_PASSWORD: ${SPOND_PASSWORD:-}
      SPOND_PYTHON: /opt/spond/bin/python
    volumes:
      - historic_caddy_data:/data
      - historic_caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  historic_pg_prod:
  historic_caddy_data:
    name: historic_caddy_data
    external: true
  historic_caddy_config:
    name: historic_caddy_config
    external: true
